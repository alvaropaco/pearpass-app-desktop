app-id: com.pears.pass
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: pearpass

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-config/pear:create
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --system-talk-name=org.freedesktop.DBus
  - --system-talk-name=org.bluez
  - --system-talk-name=org.freedesktop.UPower

modules:
  - name: pearpass
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        XDG_CACHE_HOME: /run/build/pearpass/flatpak-node/cache
        npm_config_cache: /run/build/pearpass/flatpak-node/npm-cache
    build-commands:
      - node flatpak/patch-for-offline.cjs
      - npm install --offline --ignore-scripts --legacy-peer-deps
      - cd appling && npm install --offline --ignore-scripts
      - npm run build:prod
      - |
        . flatpak-node/electron-builder-arch-args.sh
        npx electron-builder --linux dir \
          -c electron-builder.linux.json \
          -c.linux.target=dir \
          --publish never \
          $ELECTRON_BUILDER_ARCH_ARGS
      - mkdir -p /app/lib/pearpass
      - cp -a out/linux*unpacked/. /app/lib/pearpass/
      - install -Dm755 flatpak/pearpass.sh /app/bin/pearpass
      - install -Dm755 flatpak/pearpass-native-host.sh /app/bin/pearpass-native-host
      - install -Dm644 flatpak/com.pears.pass.desktop
          /app/share/applications/com.pears.pass.desktop
      - install -Dm644 flatpak/com.pears.pass.metainfo.xml
          /app/share/metainfo/com.pears.pass.metainfo.xml
      - install -Dm644 flatpak/icon-512.png
          /app/share/icons/hicolor/512x512/apps/com.pears.pass.png

    sources:
      - type: git
        url: file:///home/alvaro/pearpass-app-desktop
        branch: fix/flatpak-offline-build-capabilities
      - generated-sources.json
      - generated-sources-appling.json
